[package]
name = "picocap"
version = "1.4.0"
edition = "2021"
description = "PicoCap - the tiny PCAP/PCAPNG capture intake checker"
license = "MIT"
authors = ["Herbert Dirnberger"]
readme = "README.md"

[[bin]]
name = "picocap"
path = "src/main.rs"

[dependencies]
pcap-parser = "0.16"
sha2 = "0.10"
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1
